services:
  - type: web
    name: yuno-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt # or oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yuno-db
          property: connectionString

databases:
  - name: yuno-db
    plan: free
    region: frankfurt
